<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vollkorn — рецепт вкусных букв</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="site-block block-shop" aria-label="Витрина пекарни Vollkorn">
      <img class="artwork artwork-shop" src="vollkorn-design.svg" alt="Витрина пекарни">
    </section>

    <section class="site-block block-languages" aria-label="Буквенные композиции и языки">
      <img class="artwork artwork-languages" src="vollkorn-design.svg" alt="разные языки">
    </section>

    <section class="site-block block-specimen" aria-label="Начертания шрифта Vollkorn">
      <img class="artwork artwork-specimen" src="vollkorn-design.svg" alt="начертание в блокноте">
    </section>

    <section class="site-block block-history" aria-label="Анатомия букв и история шрифта">
      <img class="artwork artwork-history" src="vollkorn-design.svg" alt="Анатомия букв и история">
    </section>

    <section class="site-block block-ending" aria-label="Заключительная иллюстрация">
      <img class="artwork artwork-ending" src="vollkorn-design.svg" alt="мили девочка ест печенье">
    </section>
  </main>
</body>
</html>
